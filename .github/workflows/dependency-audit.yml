name: Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        -r
        ./
      upload-sarif: false
      fail-on-vuln: false
